apiVersion: apps/v1
kind: Deployment
metadata:
  name: retailer-deploy
  namespace: vkpaints-dev-ns
spec:
  replicas: 1
  selector:
    matchLabels:
      app: retailer-service
  template:
    metadata:
      labels:
        app: retailer-service
    spec:
      containers:
      - name: retailer-container
        image: shubha20/vk-paints_retailer-service:v1.0.0
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: retailer-config
        livenessProbe:
          httpGet:
            path: /health
            port: 3005
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /health
            port: 3005
          initialDelaySeconds: 5
          periodSeconds: 10

        - containerPort: 3000

